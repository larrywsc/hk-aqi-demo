<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港空氣質素即時看板 | HK AQI Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aqhi: {
              low: '#22c55e',
              moderate: '#eab308',
              high: '#f97316',
              veryhigh: '#ef4444',
              serious: '#a855f7'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .card-border-low { border-color: #22c55e; }
    .card-border-moderate { border-color: #eab308; }
    .card-border-high { border-color: #f97316; }
    .card-border-veryhigh { border-color: #ef4444; }
    .card-border-serious { border-color: #a855f7; }
    .badge-low { background-color: #22c55e; }
    .badge-moderate { background-color: #eab308; color: #1f2937; }
    .badge-high { background-color: #f97316; }
    .badge-veryhigh { background-color: #ef4444; }
    .badge-serious { background-color: #a855f7; }
    .aqhi-number { text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .refresh-spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 sm:py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">
          香港空氣質素即時看板
        </h1>
        <p class="text-sm text-slate-500 mt-0.5">
          最後更新：<span id="last-updated">—</span>
          <span id="data-source" class="ml-2 text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600"></span>
        </p>
      </div>
      <button
        id="refresh-btn"
        class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-medium text-sm shadow-sm transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        重新整理數據
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 sm:py-8">
    <!-- Status / Error -->
    <div id="status-msg" class="hidden mb-5 px-4 py-3 rounded-lg text-sm"></div>

    <!-- Cards Grid -->
    <div id="stations-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
      <!-- Cards injected by JS -->
    </div>

    <!-- Legend -->
    <section class="mt-8 bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">健康風險等級說明</h2>
      <div class="flex flex-wrap gap-3 text-xs sm:text-sm">
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-aqhi-low"></span> 低 (1–3)</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-aqhi-moderate"></span> 中 (4–6)</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-aqhi-high"></span> 高 (7)</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-aqhi-veryhigh"></span> 甚高 (8–10)</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-aqhi-serious"></span> 嚴重 (10+)</span>
      </div>
      <p class="mt-3 text-xs text-slate-500 leading-relaxed">
        數據來源：香港環境保護署（EPD）空氣質素健康指數（AQHI）。若官方 API 無法存取，系統會自動載入模擬數據以供預覽。
      </p>
    </section>
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-6 text-center text-xs text-slate-400">
    HK AQI Dashboard · 僅供參考 · 請以 <a href="https://www.aqhi.gov.hk" target="_blank" rel="noopener" class="underline hover:text-sky-600">環保署官方網站</a> 為準
  </footer>

  <script>
    // ========== Config ==========
    const TARGET_STATIONS = ['中西區', '銅鑼灣', '旺角', '葵涌', '觀塘'];
    // Traditional Chinese RSS feed from EPD
    const API_URL = 'https://www.aqhi.gov.hk/epd/ddata/html/out/aqhi_ind_rss_ChT.xml';

    // Health risk mapping (AQHI scale)
    function getRiskLevel(aqhi) {
      const n = parseAqhi(aqhi);
      if (n === null) return { key: 'unknown', label: '未知', advice: '無法取得有效指數。' };
      if (n >= 11) return { key: 'serious', label: '嚴重', advice: '所有人士應避免戶外體力消耗及停留在戶外，尤其在交通繁忙地方。室外工作的僱主應評估戶外工作風險，並採取適當預防措施保障僱員健康。' };
      if (n >= 8) return { key: 'veryhigh', label: '甚高', advice: '兒童、長者及心臟病或呼吸系統疾病患者應盡量減少戶外體力消耗，以及減少在戶外逗留的時間，尤其在交通繁忙地方。一般人士應減少戶外體力消耗，以及減少在戶外逗留的時間，尤其在交通繁忙地方。' };
      if (n === 7) return { key: 'high', label: '高', advice: '兒童、長者及心臟病或呼吸系統疾病患者應減少戶外體力消耗，以及減少在戶外逗留的時間，尤其在交通繁忙地方。' };
      if (n >= 4) return { key: 'moderate', label: '中', advice: '一般情況下無需特別措施。心臟病或呼吸系統疾病患者如感不適，應考慮減少戶外體力消耗。' };
      return { key: 'low', label: '低', advice: '空氣質素良好，適合進行各類戶外活動。' };
    }

    function parseAqhi(val) {
      if (val === null || val === undefined) return null;
      const s = String(val).trim();
      if (s === '10+' || s === '10＋') return 11;
      const n = parseInt(s, 10);
      return isNaN(n) ? null : n;
    }

    function formatAqhiDisplay(aqhi) {
      const n = parseAqhi(aqhi);
      if (n === null) return '—';
      if (n >= 11) return '10+';
      return String(n);
    }

    // ========== Fallback mock data (5 core stations) ==========
    function getMockData() {
      const base = [
        { name: '中西區', aqhi: 4 },
        { name: '銅鑼灣', aqhi: 5 },
        { name: '旺角', aqhi: 6 },
        { name: '葵涌', aqhi: 4 },
        { name: '觀塘', aqhi: 5 }
      ];
      return base.map(s => ({
        name: s.name,
        aqhi: Math.min(10, Math.max(1, s.aqhi + (Math.random() > 0.7 ? (Math.random() > 0.5 ? 1 : -1) : 0))),
        type: s.name === '銅鑼灣' || s.name === '旺角' ? '路邊' : '一般',
        updated: new Date()
      }));
    }

    // ========== Parse RSS XML ==========
    function parseRssXml(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'text/xml');
      const items = doc.querySelectorAll('item');
      const stations = [];
      items.forEach(item => {
        const title = item.querySelector('title')?.textContent?.trim() || '';
        const desc = item.querySelector('description')?.textContent?.trim() || '';
        const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';
        let aqhi = null;
        let type = '一般';
        const match = desc.match(/[:：]\s*(\d+|10\+|10＋)\s*/);
        if (match) aqhi = match[1];
        if (desc.includes('路邊') || desc.toLowerCase().includes('roadside')) type = '路邊';
        stations.push({
          name: title,
          aqhi,
          type,
          updated: pubDate ? new Date(pubDate) : new Date(),
          rawDesc: desc
        });
      });
      return stations;
    }

    // ========== Filter to target stations ==========
    function filterTargetStations(allStations) {
      const map = new Map(allStations.map(s => [s.name, s]));
      const aliases = {
        '中西區': ['中西區', 'Central/Western', 'Central / Western'],
        '銅鑼灣': ['銅鑼灣', 'Causeway Bay'],
        '旺角': ['旺角', 'Mong Kok'],
        '葵涌': ['葵涌', 'Kwai Chung'],
        '觀塘': ['觀塘', 'Kwun Tong']
      };
      return TARGET_STATIONS.map(name => {
        const candidates = aliases[name] || [name];
        for (const c of candidates) {
          if (map.has(c)) return { ...map.get(c), name };
        }
        return null;
      }).filter(Boolean);
    }

    // ========== Render ==========
    function renderCards(stations) {
      const grid = document.getElementById('stations-grid');
      if (!stations || stations.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-500">
            暫無監測站數據
          </div>`;
        return;
      }

      grid.innerHTML = stations.map(station => {
        const risk = getRiskLevel(station.aqhi);
        const display = formatAqhiDisplay(station.aqhi);
        const borderClass = `card-border-${risk.key}`;
        const badgeClass = `badge-${risk.key}`;
        const typeLabel = station.type === '路邊' ? '路邊監測站' : '一般監測站';

        return `
          <article class="bg-white rounded-xl border-2 ${borderClass} shadow-sm hover:shadow-md transition-shadow overflow-hidden flex flex-col">
            <div class="p-5 flex-1">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h3 class="text-lg font-semibold text-slate-900">${station.name}</h3>
                  <p class="text-xs text-slate-500 mt-0.5">${typeLabel}</p>
                </div>
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium text-white ${badgeClass}">
                  ${risk.label}
                </span>
              </div>
              <div class="mt-4 flex items-end gap-2">
                <span class="aqhi-number text-5xl font-bold tracking-tight text-slate-900">${display}</span>
                <span class="text-sm text-slate-500 mb-1.5">AQHI</span>
              </div>
            </div>
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100">
              <p class="text-xs font-medium text-slate-600 mb-1">公眾健康建議</p>
              <p class="text-xs text-slate-500 leading-relaxed">${risk.advice}</p>
            </div>
          </article>
        `;
      }).join('');
    }

    function setStatus(message, type = 'info') {
      const el = document.getElementById('status-msg');
      if (!message) {
        el.classList.add('hidden');
        el.textContent = '';
        return;
      }
      el.classList.remove('hidden');
      el.textContent = message;
      el.className = 'mb-5 px-4 py-3 rounded-lg text-sm ' + (
        type === 'error' ? 'bg-red-50 text-red-700 border border-red-200' :
        type === 'warn' ? 'bg-amber-50 text-amber-800 border border-amber-200' :
        'bg-sky-50 text-sky-800 border border-sky-200'
      );
    }

    function setLoading(isLoading) {
      const btn = document.getElementById('refresh-btn');
      const icon = document.getElementById('refresh-icon');
      btn.disabled = isLoading;
      if (isLoading) {
        icon.classList.add('refresh-spin');
      } else {
        icon.classList.remove('refresh-spin');
      }
    }

    function updateMeta(updatedAt, sourceLabel) {
      const el = document.getElementById('last-updated');
      const src = document.getElementById('data-source');
      if (updatedAt instanceof Date && !isNaN(updatedAt)) {
        el.textContent = updatedAt.toLocaleString('zh-HK', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: false
        });
      } else {
        el.textContent = '—';
      }
      src.textContent = sourceLabel || '';
    }

    // ========== Fetch ==========
    async function fetchLiveData() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      try {
        const res = await fetch(API_URL, {
          signal: controller.signal,
          cache: 'no-store',
          headers: { 'Accept': 'application/xml, text/xml, */*' }
        });
        clearTimeout(timeout);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (!text.includes('<item>') && !text.includes('<rss')) {
          throw new Error('Invalid RSS response');
        }
        return parseRssXml(text);
      } catch (err) {
        clearTimeout(timeout);
        throw err;
      }
    }

    async function loadData() {
      setLoading(true);
      setStatus('');
      try {
        const all = await fetchLiveData();
        const filtered = filterTargetStations(all);
        if (filtered.length === 0) {
          throw new Error('Target stations not found in feed');
        }
        renderCards(filtered);
        const latest = filtered.reduce((max, s) =>
          (s.updated && s.updated > max) ? s.updated : max, new Date(0));
        updateMeta(latest, '即時 · 環保署');
        setStatus('');
      } catch (err) {
        console.warn('Live API failed, using fallback:', err.message);
        const mock = getMockData();
        renderCards(mock);
        updateMeta(new Date(), '模擬數據');
        setStatus('無法連接官方 API（可能因跨域限制或網絡問題），已載入模擬數據。點擊「重新整理」可再試。', 'warn');
      } finally {
        setLoading(false);
      }
    }

    // ========== Init ==========
    document.getElementById('refresh-btn').addEventListener('click', loadData);
    loadData();
  </script>
</body>
</html>
